<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta
      name="description"
      content="Stocknet connects buyers with agricultural producers: machinery, fertilizers and fresh produce, sold by measure or by lot."
    />
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <title>Stocknet — B2B producer marketplace</title>
    <style>
      /* Shown from the first paint until the app has loaded and replaces the content of #root. */
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f6f6f6;
      }
      [data-theme='dark'] .splash {
        background: #0a0a0a;
      }
      .splash svg {
        width: 56px;
        height: 56px;
        opacity: 0;
        animation:
          splash-in 0.2s 0.15s forwards,
          splash-pulse 1.1s 0.35s ease-in-out infinite alternate;
      }
      @keyframes splash-in {
        to {
          opacity: 1;
        }
      }
      @keyframes splash-pulse {
        to {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash svg {
          animation: none;
          opacity: 1;
        }
      }
    </style>
    <script>
      try {
        var t = localStorage.getItem('sy-theme')
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Stocknet">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="7" fill="#c8102e" />
          <path
            d="M7 21.5 13 11l4.2 6.3 2.3-3.4L25 21.5"
            fill="none"
            stroke="#fff"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
